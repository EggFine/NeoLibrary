name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release NeoLibrary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Version
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          RAW="${INPUT_VERSION:-$REF_NAME}"
          VERSION="${RAW#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $RAW" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test & Build Release JAR
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.VERSION }}
        run: ./gradlew clean test build -Prelease=true -PpluginVersion="$RELEASE_VERSION" --no-daemon

      - name: Extract Bilingual Changelog
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.VERSION }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          ver = os.environ["RELEASE_VERSION"]
          changelog_path = pathlib.Path("CHANGELOG.md")
          text = changelog_path.read_text(encoding="utf-8") if changelog_path.exists() else ""
          pattern = re.compile(rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)", re.MULTILINE | re.DOTALL)
          match = pattern.search(text)
          if match and match.group(1).strip():
              notes = match.group(1).strip() + "\n"
          else:
              notes = (
                  f"### 简体中文\n\n- NeoLibrary v{ver} 正式版发布。\n\n"
                  f"---\n\n"
                  f"### English\n\n- Official release of NeoLibrary v{ver}.\n"
              )
          pathlib.Path("release_notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoLibrary-${{ steps.meta.outputs.VERSION }}
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
          retention-days: 90

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          name: "NeoLibrary ${{ steps.meta.outputs.TAG }}"
          tag: "${{ steps.meta.outputs.TAG }}"
          bodyFile: "release_notes.md"
          artifacts: "build/libs/*.jar"
          generateReleaseNotes: false
          makeLatest: true
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
