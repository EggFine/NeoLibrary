name: CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test NeoLibrary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test & Build with Gradle
        run: ./gradlew clean test build --no-daemon

      - name: Resolve Artifact Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(./gradlew properties -q | awk '/^version:/ {print $2}')
          echo "Detected CI version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoLibrary-${{ steps.get_version.outputs.VERSION }}
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
          retention-days: 90
