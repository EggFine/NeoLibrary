version: "1.0.0"

# General
languageName: "English (US)"
loadedLanguage: "Loaded language file: %s"

# Logo
logo:
  status: "Loading..."
  subTitle: "The Next Generation blbiLibrary\nSpigotMC: https://www.spigotmc.org/resources/125811/"

# Update Checker
updateChecker:
  found: "&aA new version is available: &e%s &7(Current: %s)"
  download: "&aDownload it at: &e%s"
  error: "&cFailed to check for updates: %s"
  upToDate: "&aYou are running the latest version."
  failedConnection: "&cCould not connect to update server: %s"
  parseError: "&cCould not parse version from server version string, update check skipped."
  parseMcError: "&cCould not parse Minecraft version: %s"
  invalidVersion: "&cCurrent plugin version format is invalid, cannot check for updates."
  noVersions: "&eCould not parse any version information from API response."

# ConfigUtil
configUtil:
  notInJar: "&eConfig file '%s' not found in plugin jar, skipping version check."
  localVersion: "&7Current config version: %s, Latest config version: %s"
  newVersionDetected: "&aNew config version detected! Automatically updating configuration..."
  updateComplete: "&aConfig update complete! New version is %s."
  upToDate: "&aYou are using the latest config version."
  notExist: "&7Config file does not exist, exporting default config from plugin resources."
  notInResource: "&eResource file '%s' not found in plugin jar, creating an empty file."
  reloading: "&7Reloading configuration file..."

# FoliaUtil
foliaUtil:
  foliaDetected: "&aDetected Folia-compatible core, using Folia scheduler"
  bukkitDetected: "&aDetected standard Bukkit core, using standard scheduler"
  foliaInitError: "&cDetected Folia environment, but failed to initialize Folia scheduler! Possibly version incompatible. Falling back to standard Bukkit scheduler."
