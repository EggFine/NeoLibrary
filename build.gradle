plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "3.0.2"
    id 'com.gradleup.shadow' version '8.3.9'
}

group = 'com.blbilink'

def buildNumber = System.getenv("GITHUB_RUN_NUMBER")
version = buildNumber ? "${pluginVersion}.${buildNumber}" : "${pluginVersion}-SNAPSHOT"

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    // 以纯 Spigot 1.21 为编译基线，确保 100% 兼容 Spigot / Paper / Purpur / Folia 1.21.x 全系服务端
    compileOnly 'org.spigotmc:spigot-api:1.21-R0.1-SNAPSHOT'
    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly 'com.google.errorprone:error_prone_annotations:2.38.0'
    compileOnly 'org.slf4j:slf4j-api:2.0.16'

    // 打包 HikariCP 6.x 并排除 slf4j-api，直接复用服务端内置 SLF4J 2.x 避免类加载冲突
    implementation('com.zaxxer:HikariCP:6.3.0') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }

    testImplementation 'org.spigotmc:spigot-api:1.21-R0.1-SNAPSHOT'
    testImplementation 'org.jetbrains:annotations:26.0.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.slf4j:slf4j-nop:2.0.16'
}

test {
    useJUnitPlatform()
}

tasks.runServer {
    minecraftVersion("1.21.8")
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.named('jar') {
    archiveClassifier.set('plain')
    enabled = false
}

shadowJar {
    relocate 'com.zaxxer.hikari', 'com.blbilink.neoLibrary.lib.hikaricp'
    archiveClassifier.set('')
    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

tasks.build {
    dependsOn(shadowJar)
}
